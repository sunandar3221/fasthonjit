name: Build and Release FasthonJIT

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Windows Binary
        shell: bash
        run: |
          g++ -std=c++20 -O3 -static -static-libgcc -static-libstdc++ src/*.cpp -Iinclude -lwininet -lgdi32 -luser32 -o fasthonjit-windows-x64.exe
          cp fasthonjit-windows-x64.exe fasthonjit.exe
          cp fasthonjit-windows-x64.exe fasthon-windows-x64.exe
          cp fasthonjit-windows-x64.exe fasthon.exe
          cp fasthonjit-windows-x64.exe eas-windows-x64.exe
          cp fasthonjit-windows-x64.exe eas.exe

      - name: Test fasthonjit build on Windows
        shell: bash
        run: |
          ./fasthonjit.exe --version
          ./fasthonjit.exe --jit-info
          ./fasthonjit.exe build main.fsn -o test_main.exe
          echo "Agus" | ./test_main.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            fasthonjit-windows-x64.exe
            fasthonjit.exe
            fasthon-windows-x64.exe
            fasthon.exe
            eas-windows-x64.exe
            eas.exe

  build-linux-and-android:
    name: Build Linux & Android (Termux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ g++-aarch64-linux-gnu

      - name: Compile Linux x86_64 Binaries
        run: |
          g++ -std=c++20 -O3 src/*.cpp -Iinclude -o fasthonjit-linux-x64
          g++ -std=c++20 -O3 -static src/*.cpp -Iinclude -o fasthonjit-linux-x64-static
          chmod +x fasthonjit-linux-x64 fasthonjit-linux-x64-static
          cp fasthonjit-linux-x64 fasthon-linux-x64
          cp fasthonjit-linux-x64-static fasthon-linux-x64-static
          cp fasthonjit-linux-x64 eas-linux-x64
          cp fasthonjit-linux-x64-static eas-linux-x64-static

      - name: Compile Linux ARM64 Static Binary
        run: |
          aarch64-linux-gnu-g++ -std=c++20 -O3 -static src/*.cpp -Iinclude -o fasthonjit-linux-arm64-static
          chmod +x fasthonjit-linux-arm64-static
          cp fasthonjit-linux-arm64-static fasthon-linux-arm64-static
          cp fasthonjit-linux-arm64-static eas-linux-arm64-static

      - name: Compile Android Termux ARM64 Native Binary
        run: |
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $NDK_DIR"
          $NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ -std=c++20 -O3 -static-libstdc++ src/*.cpp -Iinclude -o fasthonjit-android-arm64
          chmod +x fasthonjit-android-arm64
          cp fasthonjit-android-arm64 fasthon-android-arm64
          cp fasthonjit-android-arm64 eas-android-arm64
          echo "Verifying shared library dependencies of fasthonjit-android-arm64:"
          readelf -d fasthonjit-android-arm64 | grep NEEDED || true

      - name: Test fasthonjit build for Linux and Android
        run: |
          # Test Linux AOT build
          ./fasthonjit-linux-x64 build main.fsn --target linux -o test_main_linux
          echo "Agus" | ./test_main_linux

          # Test Android AOT build
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          export ANDROID_NDK_ROOT="$NDK_DIR"
          ./fasthonjit-linux-x64 build main.fsn --target android -o test_main_android
          readelf -h test_main_android | grep -E "Class|Machine"

      - name: Upload Linux and Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-binaries
          path: |
            fasthonjit-linux-x64
            fasthonjit-linux-x64-static
            fasthonjit-linux-arm64-static
            fasthonjit-android-arm64
            fasthon-linux-x64
            fasthon-linux-x64-static
            fasthon-linux-arm64-static
            fasthon-android-arm64
            eas-linux-x64
            eas-linux-x64-static
            eas-linux-arm64-static
            eas-android-arm64

  release:
    name: Publish Release Assets
    needs: [build-windows, build-linux-and-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Download Linux & Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-android-binaries
          path: dist

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.tag_info.outputs.tag }} dist/* --clobber || gh release create ${{ steps.tag_info.outputs.tag }} dist/* --title "FasthonJIT ${{ steps.tag_info.outputs.tag }}" --notes "Multi-platform prebuilt binaries for Windows, Linux, and Android (Termux) powered by FasthonJIT Ultra High-Performance JIT Engine."
